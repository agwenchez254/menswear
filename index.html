<!doctype html>
<html lang="en" data-gender="men">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jabali: menswear and womenswear delivered across Kenya. Pay with M-Pesa." />
    <title>Jabali | Clothes delivered across Kenya</title>
    <link rel="icon" type="image/svg+xml" href="/brand/jabali-sassy-mark-men-light.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <script>
      try {
        var t = localStorage.getItem("jabali-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var g = localStorage.getItem("jabali-gender");
        if (g === "men" || g === "women") document.documentElement.setAttribute("data-gender", g);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
